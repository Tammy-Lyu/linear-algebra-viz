<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>向量空间概念 · 3D 线性空间与子空间</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--mut:#94a3b8;--accent:#3b82f6;--red:#ef4444;--green:#22c55e;--amber:#f59e0b;--line:#334155}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;overflow:hidden}
  #canvas3d{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
  .panel{position:fixed;top:16px;right:16px;width:310px;background:rgba(30,41,59,.92);border:1px solid var(--line);border-radius:12px;padding:16px;backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:10;max-height:calc(100vh - 32px);overflow-y:auto}
  h1{font-size:17px;margin-bottom:2px}
  .sub{color:var(--mut);font-size:12px;margin-bottom:12px}
  .vec{margin-bottom:6px;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
  .vec-head{display:flex;justify-content:space-between;margin-bottom:2px}
  .vec-name{font-size:13px;font-weight:600}
  .vec .row{display:grid;grid-template-columns:22px 1fr 32px;align-items:center;gap:5px;margin:2px 0}
  .vec .row label{font-size:11px;color:var(--mut);text-align:right}
  .vec input[type=range]{width:100%;accent-color:var(--accent)}
  .vec .num{font-family:Consolas,monospace;font-size:11px;text-align:right}
  .sliders{margin:8px 0}
  .sliders .row{display:grid;grid-template-columns:70px 1fr 40px;align-items:center;gap:8px;margin:4px 0}
  .sliders .row label{font-size:12px;color:var(--mut);text-align:right}
  .sliders input[type=range]{width:100%;accent-color:var(--amber)}
  .sliders .num{font-family:Consolas,monospace;font-size:12px;text-align:right}
  .result{background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px}
  .result .big{font-size:14px;font-weight:700;margin-bottom:2px}
  .result .det{font-size:12px;color:var(--mut)}
  .presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .presets button{background:#0f172a;border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:4px 12px;font-size:12px;cursor:pointer}
  .presets button:hover{border-color:var(--amber);color:var(--amber)}
  .hint{font-size:11px;color:var(--mut);margin-top:10px}
  .legend{position:fixed;bottom:16px;left:16px;background:rgba(30,41,59,.85);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px;z-index:10}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .title-top{position:fixed;top:16px;left:16px;background:rgba(30,41,59,.85);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;z-index:10}
</style>
</head>
<body>
<div id="canvas3d"></div>
<div class="title-top">🔭 拖动旋转 | 线性空间：对加法与数乘封闭 · 子空间：过原点的直线/平面</div>

<div class="panel">
  <h1>向量空间的概念</h1>
  <div class="sub">同济第七版 · 第4章 —— 3维向量空间 R³ 及子空间（过原点直线/平面）</div>

  <div class="presets" id="subspaceBtns">
    <button data-s="3d">R³ 全空间</button>
    <button data-s="plane">子空间：xy 平面（2维）</button>
    <button data-s="line">子空间：x轴（1维）</button>
    <button data-s="zero">子空间：原点（0维）</button>
  </div>

  <div class="sliders">
    <div class="row"><label>加法 t₁</label><input type="range" id="t1" min="-2" max="2" step="0.1" value="1"><span class="num" id="t1n">1</span></div>
    <div class="row"><label>数乘 t₂</label><input type="range" id="t2" min="-2" max="2" step="0.1" value="1"><span class="num" id="t2n">1</span></div>
  </div>

  <div class="result">
    <div class="big" id="closure">α + β = (3, 2, 1) ∈ 子空间 ✓</div>
    <div class="det" id="detail">对加法与数乘封闭（子空间判定）</div>
  </div>

  <div class="hint">💡 向量空间 V 需满足：加法封闭（α+β∈V）、数乘封闭（kα∈V）、含零向量、每个向量有负元。子空间：V 的非空子集 W，若 W 对加法和数乘封闭则 W 是子空间。子空间必过原点。</div>
</div>

<div class="legend">
  <div><span class="dot" style="background:#f87171"></span>α（在子空间内）</div>
  <div><span class="dot" style="background:#4ade80"></span>β（在子空间内）</div>
  <div><span class="dot" style="background:#fbbf24"></span>α+β（封闭性验证）</div>
  <div style="color:var(--mut)">半透明 = 当前子空间</div>
</div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(6, 5, 8); camera.lookAt(0,0,0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.getElementById('canvas3d').appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.15;
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
scene.add(new THREE.GridHelper(9, 9, 0x334155, 0x1e293b));
const axes = new THREE.Group();
function ax(dir,color){const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),dir.clone().multiplyScalar(4)]);axes.add(new THREE.Line(g,new THREE.LineBasicMaterial({color})));}
ax(new THREE.Vector3(1,0,0),0xf87171);ax(new THREE.Vector3(0,1,0),0x4ade80);ax(new THREE.Vector3(0,0,1),0x60a5fa);
scene.add(axes);

// 子空间几何体
const planeMesh=new THREE.Mesh(new THREE.PlaneGeometry(9,9),new THREE.MeshBasicMaterial({color:0x3b82f6,transparent:true,opacity:0.18,side:THREE.DoubleSide,depthWrite:false}));
scene.add(planeMesh);
const lineMesh=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0xfbbf24,linewidth:2}));
scene.add(lineMesh);

const arrows={};
['a','b','s'].forEach(k=>{
  const a=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(0,0,0),1,k==='a'?0xf87171:(k==='b'?0x4ade80:0xfbbf24),0.28,0.16);
  scene.add(a);arrows[k]=a;
});
function setArrow(arrow,v,color){
  const vec=new THREE.Vector3(v[0],v[1],v[2]),len=vec.length();
  if(len<0.02){arrow.visible=false;return;}
  arrow.visible=true;arrow.setDirection(vec.clone().normalize());
  arrow.setLength(len,Math.min(0.32,len*0.18),Math.min(0.18,len*0.1));
  if(color)arrow.setColor(new THREE.Color(color));
}
let subspace='3d';
const A=[1,1,0],B=[2,1,0]; // 默认在 xy 平面
function inSubspace(v){
  if(subspace==='3d')return true;
  if(subspace==='plane')return Math.abs(v[2])<1e-6;
  if(subspace==='line')return Math.abs(v[1])<1e-6&&Math.abs(v[2])<1e-6;
  return Math.abs(v[0])<1e-6&&Math.abs(v[1])<1e-6&&Math.abs(v[2])<1e-6;
}
function update(){
  const t1=parseFloat(document.getElementById('t1').value),t2=parseFloat(document.getElementById('t2').value);
  document.getElementById('t1n').textContent=t1.toFixed(1);
  document.getElementById('t2n').textContent=t2.toFixed(1);
  const a=A.slice(), b=B.slice();
  const s=[a[0]*t1+b[0]*t2, a[1]*t1+b[1]*t2, a[2]*t1+b[2]*t2];
  setArrow(arrows.a,a);setArrow(arrows.b,b);setArrow(arrows.s,s);
  // 子空间几何体
  planeMesh.visible=(subspace==='3d'||subspace==='plane');
  if(subspace==='3d'||subspace==='plane'){planeMesh.lookAt(new THREE.Vector3(0,0,1));}
  if(subspace==='line'){
    const g=lineMesh.geometry;
    g.setFromPoints([new THREE.Vector3(-4,0,0),new THREE.Vector3(4,0,0)]);
  }
  lineMesh.visible=(subspace==='line'||subspace==='zero');
  if(subspace==='zero'){const g=lineMesh.geometry;g.setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,0)]);}
  const el=document.getElementById('closure'),de=document.getElementById('detail');
  const okA=inSubspace(a),okB=inSubspace(b),okS=inSubspace(s);
  const allOk=okA&&okB&&okS;
  el.textContent='α = ('+a.map(v=>v.toFixed(1))+')  β = ('+b.map(v=>v.toFixed(1))+')  α+β = ('+s.map(v=>v.toFixed(1))+')';
  el.className='big '+(allOk?'':'bad');
  de.textContent=(allOk?'✓ 封闭性成立：α,β,α+β 都在子空间内':'✗ 有向量不在子空间内')+' | 当前子空间：'+(subspace==='3d'?'R³（3维）':subspace==='plane'?'xy平面（2维）':subspace==='line'?'x轴（1维）':'原点（0维）');
}
document.getElementById('t1').addEventListener('input',update);
document.getElementById('t2').addEventListener('input',update);
document.getElementById('subspaceBtns').addEventListener('click',function(e){
  const b=e.target.closest('button');if(!b)return;
  subspace=b.dataset.s;update();
});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
update();animate();
</script>
</body>
</html>
