<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倍加变换 · 行加 k 倍另一行</title>
<style>
  :root{--bg:#f7f9fc;--card:#fff;--ink:#1f2937;--mut:#6b7280;--accent:#2563eb;--red:#dc2626;--green:#16a34a;--line:#e5e7eb}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);padding:20px;line-height:1.6}
  .wrap{max-width:960px;margin:0 auto}
  h1{font-size:21px;margin-bottom:4px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:700px){.grid2{grid-template-columns:1fr}}
  .matrix-input{display:grid;gap:6px;justify-content:center;margin:8px 0}
  .matrix-input input{width:54px;height:36px;text-align:center;border:1px solid var(--line);border-radius:6px;font-family:Consolas,monospace;font-size:14px;background:#fff}
  .matrix-input input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .result{background:#f0f6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px;margin-top:10px}
  .result .big{font-size:17px;font-weight:700;color:var(--accent);margin-bottom:4px}
  .result .det{font-size:13px;color:#1e40af}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .presets button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer;transition:all .15s}
  .presets button:hover{border-color:var(--accent);color:var(--accent)}
  .steps{font-family:Consolas,monospace;font-size:13px;margin-top:8px;line-height:1.8}
  .steps .s{color:#374151}
  .tip{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 12px;font-size:13px;color:#1e40af;margin-top:12px}
  .sliders{margin:10px 0}
  .sliders .row{display:grid;grid-template-columns:80px 1fr 44px;align-items:center;gap:10px;margin:5px 0}
  .sliders .row label{font-size:13px;color:var(--mut);text-align:right}
  .sliders input[type=range]{width:100%;accent-color:var(--accent)}
  .sliders .num{font-family:Consolas,monospace;font-size:13px;text-align:right}
  .foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
  .ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}

</style>
</head>
<body>
<div class="wrap">
  <h1>倍加变换 · 行加 k 倍另一行</h1>
  <div class="sub">同济第七版 · 第3章 —— 消元核心操作，行列式不变</div>

  <div class="card">
    <div style="font-size:14px;font-weight:600;margin-bottom:6px">矩阵</div>
    <div class="matrix-input" id="mA" style="grid-template-columns:repeat(3,54px)">
      <input data-i="0,0" value="1"><input data-i="0,1" value="2"><input data-i="0,2" value="3">
      <input data-i="1,0" value="4"><input data-i="1,1" value="5"><input data-i="1,2" value="6">
      <input data-i="2,0" value="7"><input data-i="2,1" value="8"><input data-i="2,2" value="9">
    </div>
    <div class="sliders">
      <div class="row"><label>目标行</label><input type="range" id="ti" min="0" max="2" step="1" value="1"><span class="num" id="tiv">第2行</span></div>
      <div class="row"><label>来源行</label><input type="range" id="si" min="0" max="2" step="1" value="0"><span class="num" id="siv">第1行</span></div>
      <div class="row"><label>倍数 k</label><input type="range" id="k" min="-3" max="3" step="0.1" value="1"><span class="num" id="kv">1</span></div>
    </div>
    <div class="result">
      <div class="big">r<sub>i</sub> ← r<sub>i</sub> + k×r<sub>j</sub>：倍加</div>
      <div class="det" id="detail">行列式不变（方阵）</div>
    </div>
    <div class="tip">💡 倍加变换 rᵢ←rᵢ+k×rⱼ：行列式不变，是消元（化三角形法、高斯消元）的核心操作。</div>
  </div>
  <div class="foot">线性代数教学智能体 · TF2 可视化 · 倍加变换</div>
</div>
<script>

let A=[[1,2,3],[4,5,6],[7,8,9]];
function render(){document.querySelectorAll('#mA input').forEach(inp=>{const[i,j]=inp.dataset.i.split(',').map(Number);inp.value=Math.round(A[i][j]*100)/100;});}
document.querySelectorAll('#mA input').forEach(inp=>inp.addEventListener('input',()=>{const[i,j]=inp.dataset.i.split(',').map(Number);A[i][j]=parseFloat(inp.value)||0;}));
function apply(){
  const ti=parseInt(document.getElementById('ti').value), si=parseInt(document.getElementById('si').value), k=parseFloat(document.getElementById('k').value);
  document.getElementById('tiv').textContent='第'+(ti+1)+'行'; document.getElementById('siv').textContent='第'+(si+1)+'行'; document.getElementById('kv').textContent=k.toFixed(1);
  if(ti===si&&k!==0){document.getElementById('detail').textContent='同一行不能作为来源和目标（否则行列式变'+(1+k)+'倍）';return;}
  for(let j=0;j<A[0].length;j++) A[ti][j]+=k*A[si][j];
  render();
  document.getElementById('detail').textContent='r'+(ti+1)+' ← r'+(ti+1)+' + '+k.toFixed(1)+'×r'+(si+1)+'（行列式不变）';
}
document.getElementById('ti').addEventListener('input',apply); document.getElementById('si').addEventListener('input',apply); document.getElementById('k').addEventListener('input',apply);
render();
</script>
</body>
</html>
