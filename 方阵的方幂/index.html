<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方阵的方幂 · 矩阵连乘</title>
<style>
  :root{--bg:#f7f9fc;--card:#fff;--ink:#1f2937;--mut:#6b7280;--accent:#2563eb;--red:#dc2626;--green:#16a34a;--line:#e5e7eb}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);padding:20px;line-height:1.6}
  .wrap{max-width:960px;margin:0 auto}
  h1{font-size:21px;margin-bottom:4px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:700px){.grid2{grid-template-columns:1fr}}
  .matrix-input{display:grid;gap:6px;justify-content:center;margin:8px 0}
  .matrix-input input{width:54px;height:36px;text-align:center;border:1px solid var(--line);border-radius:6px;font-family:Consolas,monospace;font-size:14px;background:#fff}
  .matrix-input input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .result{background:#f0f6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px;margin-top:10px}
  .result .big{font-size:17px;font-weight:700;color:var(--accent);margin-bottom:4px}
  .result .det{font-size:13px;color:#1e40af}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .presets button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer;transition:all .15s}
  .presets button:hover{border-color:var(--accent);color:var(--accent)}
  .steps{font-family:Consolas,monospace;font-size:13px;margin-top:8px;line-height:1.8}
  .steps .s{color:#374151}
  .tip{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 12px;font-size:13px;color:#1e40af;margin-top:12px}
  .sliders{margin:10px 0}
  .sliders .row{display:grid;grid-template-columns:80px 1fr 44px;align-items:center;gap:10px;margin:5px 0}
  .sliders .row label{font-size:13px;color:var(--mut);text-align:right}
  .sliders input[type=range]{width:100%;accent-color:var(--accent)}
  .sliders .num{font-family:Consolas,monospace;font-size:13px;text-align:right}
  .foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
  .ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}

</style>
</head>
<body>
<div class="wrap">
  <h1>方阵的方幂 · 矩阵连乘</h1>
  <div class="sub">同济第七版 · 第2章 —— 调幂次 n，看 Aⁿ 如何演化（马尔可夫趋于稳定）</div>

  <div class="card">
    <div style="font-size:14px;font-weight:600;margin-bottom:6px">方阵 A（修改元素）</div>
    <div class="matrix-input" id="mA" style="grid-template-columns:repeat(2,54px)">
      <input data-i="0,0" value="0.6"><input data-i="0,1" value="0.4">
      <input data-i="1,0" value="0.3"><input data-i="1,1" value="0.7">
    </div>
    <div class="sliders">
      <div class="row"><label>幂次 n</label><input type="range" id="pow" min="1" max="20" step="1" value="2"><span class="num" id="powv">2</span></div>
    </div>
    <div class="result">
      <div class="big" id="an">A² = ...</div>
      <div class="det" id="detail">矩阵连乘 n 次</div>
    </div>
    <div class="presets">
      <button data-p="0">马尔可夫转移矩阵</button>
      <button data-p="1">对角矩阵</button>
      <button data-p="2">幂零矩阵</button>
    </div>
    <div class="tip">💡 Aⁿ = A×A×...×A（n 次）。对角矩阵的幂：每个对角元取 n 次方。当 n→∞，马尔可夫矩阵的幂趋于稳定分布（每行相同）。</div>
  </div>
  <div class="card">
    <div style="font-size:14px;font-weight:600;margin-bottom:6px">Aⁿ 数值（每步）</div>
    <div class="steps" id="steps"></div>
  </div>
  <div class="foot">线性代数教学智能体 · TF2 可视化 · 方阵的方幂</div>
</div>
<script>

let A=[[0.6,0.4],[0.3,0.7]];
function mul2(X,Y){
  const n=X.length, C=Array.from({length:n},()=>Array(n).fill(0));
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){let s=0;for(let k=0;k<n;k++)s+=X[i][k]*Y[k][j];C[i][j]=Math.round(s*1000)/1000;}
  return C;
}
function fmt2(M){ return M.map(r=>r.map(x=>Math.round(x*1000)/1000).join(' ')).join(' | '); }
function calc(){
  const n=parseInt(document.getElementById('pow').value);
  document.getElementById('powv').textContent=n;
  let P=A.map(r=>r.slice()), steps='';
  for(let k=1;k<=n;k++){
    steps+='<div class="s">A^'+k+' = '+fmt2(P)+'</div>';
    if(k<n) P=mul2(P,A);
  }
  document.getElementById('an').textContent='A^'+n+' = '+fmt2(P);
  document.getElementById('detail').textContent='方阵 A 连乘 '+n+' 次';
  document.getElementById('steps').innerHTML=steps;
}
document.querySelectorAll('#mA input').forEach(inp=>inp.addEventListener('input',()=>{const[i,j]=inp.dataset.i.split(',').map(Number);A[i][j]=parseFloat(inp.value)||0;calc();}));
document.getElementById('pow').addEventListener('input',calc);
const presets={
  0:[[0.6,0.4],[0.3,0.7]],
  1:[[2,0],[0,3]],
  2:[[0,1],[0,0]]
};
document.querySelector('.presets').addEventListener('click',function(e){
  const b=e.target.closest('button'); if(!b)return;
  A=presets[b.dataset.p].map(r=>r.slice());
  document.querySelectorAll('#mA input').forEach(inp=>{const[i,j]=inp.dataset.i.split(',').map(Number);inp.value=A[i][j];});
  calc();
});
calc();
</script>
</body>
</html>
