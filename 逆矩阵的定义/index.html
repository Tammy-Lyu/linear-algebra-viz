<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逆矩阵的定义 · A⁻¹ 的存在与验证</title>
<style>
  :root{--bg:#f7f9fc;--card:#fff;--ink:#1f2937;--mut:#6b7280;--accent:#2563eb;--red:#dc2626;--green:#16a34a;--line:#e5e7eb}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);padding:20px;line-height:1.6}
  .wrap{max-width:960px;margin:0 auto}
  h1{font-size:21px;margin-bottom:4px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:700px){.grid2{grid-template-columns:1fr}}
  .matrix-input{display:grid;gap:6px;justify-content:center;margin:8px 0}
  .matrix-input input{width:54px;height:36px;text-align:center;border:1px solid var(--line);border-radius:6px;font-family:Consolas,monospace;font-size:14px;background:#fff}
  .matrix-input input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .result{background:#f0f6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px;margin-top:10px}
  .result .big{font-size:17px;font-weight:700;color:var(--accent);margin-bottom:4px}
  .result .det{font-size:13px;color:#1e40af}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .presets button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer;transition:all .15s}
  .presets button:hover{border-color:var(--accent);color:var(--accent)}
  .steps{font-family:Consolas,monospace;font-size:13px;margin-top:8px;line-height:1.8}
  .steps .s{color:#374151}
  .tip{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 12px;font-size:13px;color:#1e40af;margin-top:12px}
  .sliders{margin:10px 0}
  .sliders .row{display:grid;grid-template-columns:80px 1fr 44px;align-items:center;gap:10px;margin:5px 0}
  .sliders .row label{font-size:13px;color:var(--mut);text-align:right}
  .sliders input[type=range]{width:100%;accent-color:var(--accent)}
  .sliders .num{font-family:Consolas,monospace;font-size:13px;text-align:right}
  .foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
  .ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}

</style>
</head>
<body>
<div class="wrap">
  <h1>逆矩阵的定义 · A⁻¹ 的存在与验证</h1>
  <div class="sub">同济第七版 · 第2章 —— 修改 A，看 A⁻¹ 是否存在（det≠0）及 A×A⁻¹=E 验证</div>

  <div class="card">
    <div style="font-size:14px;font-weight:600;margin-bottom:6px">方阵 A</div>
    <div class="matrix-input" id="mA" style="grid-template-columns:repeat(2,54px)">
      <input data-i="0,0" value="1"><input data-i="0,1" value="2">
      <input data-i="1,0" value="3"><input data-i="1,1" value="4">
    </div>
    <div class="result">
      <div class="big" id="a1">A⁻¹ = ...</div>
      <div class="det" id="check">验证 A×A⁻¹ = E ?</div>
    </div>
    <div class="presets">
      <button data-p="0">2×2 可逆</button>
      <button data-p="1">3×3 可逆</button>
      <button data-p="2">奇异（不可逆）</button>
    </div>
    <div class="tip">💡 若 AB=BA=E，则 B 是 A 的逆矩阵 A⁻¹。可逆 ⇔ det(A)≠0。2×2 求逆公式：A⁻¹ = (1/det)[[d,-b],[-c,a]]。</div>
  </div>
  <div class="foot">线性代数教学智能体 · TF2 可视化 · 逆矩阵的定义</div>
</div>
<script>

let A=[[1,2],[3,4]], size=2;
function det2(M){return M[0][0]*M[1][1]-M[0][1]*M[1][0];}
function det3(M){
  return M[0][0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1])-M[0][1]*(M[1][0]*M[2][2]-M[1][2]*M[2][0])+M[0][2]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]);
}
function inv2(M){const d=det2(M);if(Math.abs(d)<1e-9)return null;return [[M[1][1]/d,-M[0][1]/d],[-M[1][0]/d,M[0][0]/d]];}
function adj3(M){
  const c=(i,j)=>det2([[M[(i+1)%3][(j+1)%3],M[(i+1)%3][(j+2)%3]],[M[(i+2)%3][(j+1)%3],M[(i+2)%3][(j+2)%3]]])*(((i+j)%2)?-1:1);
  return [[c(0,0),c(0,1),c(0,2)],[c(1,0),c(1,1),c(1,2)],[c(2,0),c(2,1),c(2,2)]];
}
function inv3(M){const d=det3(M);if(Math.abs(d)<1e-9)return null;const adj=adj3(M);const At=adj.map((r,i)=>r.map((v,j)=>adj[j][i]));return At.map(r=>r.map(v=>v/d));}
function mul(M,N){const n=M.length,C=Array.from({length:n},()=>Array(n).fill(0));for(let i=0;i<n;i++)for(let j=0;j<n;j++){let s=0;for(let k=0;k<n;k++)s+=M[i][k]*N[k][j];C[i][j]=Math.round(s*100)/100;}return C;}
function fmt(M){return M.map(r=>r.map(x=>Math.round(x*100)/100).join(' ')).join(' | ');}
function renderInputs(){
  const mi=document.getElementById('mA'); mi.style.gridTemplateColumns='repeat('+size+',54px)'; mi.innerHTML='';
  for(let i=0;i<size;i++)for(let j=0;j<size;j++){
    const inp=document.createElement('input'); inp.dataset.i=i+','+j; inp.value=A[i][j];
    inp.addEventListener('input',()=>{const[ii,jj]=inp.dataset.i.split(',').map(Number);A[ii][jj]=parseFloat(inp.value)||0;calc();});
    mi.appendChild(inp);
  }
}
function calc(){
  const inv=size===2?inv2(A):inv3(A);
  const el=document.getElementById('a1'), ck=document.getElementById('check');
  if(!inv){ el.textContent='不存在（奇异矩阵）'; el.className='bad'; ck.textContent='det(A)='+(size===2?det2(A):det3(A)).toFixed(2)+' = 0 → A 不可逆'; return; }
  el.className=''; el.textContent='A⁻¹ = '+fmt(inv);
  const prod=mul(A,inv); const isE=prod.every((r,i)=>r.every((v,j)=>Math.abs(v-(i===j?1:0))<0.01));
  ck.textContent='A×A⁻¹ = '+fmt(prod)+(isE?' ✓ = E（正确）':' ✗ ≠ E');
  ck.className=isE?'ok':'bad';
}
document.querySelectorAll('.presets button').forEach(b=>b.addEventListener('click',()=>{
  const p=b.dataset.p;
  if(p==='0'){size=2;A=[[1,2],[3,4]];}
  else if(p==='1'){size=3;A=[[1,2,3],[0,1,4],[5,6,0]];}
  else {size=2;A=[[1,2],[2,4]];}
  renderInputs(); calc();
}));
renderInputs(); calc();
</script>
</body>
</html>
