<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二次型的几何意义 · 标准形与椭球面</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--mut:#94a3b8;--accent:#3b82f6;--red:#ef4444;--green:#22c55e;--amber:#f59e0b;--line:#334155}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;overflow:hidden}
  #canvas3d{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
  .panel{position:fixed;top:16px;right:16px;width:300px;background:rgba(30,41,59,.92);border:1px solid var(--line);border-radius:12px;padding:16px;backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:10;max-height:calc(100vh - 32px);overflow-y:auto}
  h1{font-size:17px;margin-bottom:2px}
  .sub{color:var(--mut);font-size:12px;margin-bottom:12px}
  .formula{background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:Consolas,monospace;font-size:13px;text-align:center;margin-bottom:8px}
  .sliders{margin:8px 0}
  .sliders .row{display:grid;grid-template-columns:52px 1fr 40px;align-items:center;gap:8px;margin:4px 0}
  .sliders .row label{font-size:12px;color:var(--mut);text-align:right;font-family:Consolas,monospace}
  .sliders input[type=range]{width:100%;accent-color:var(--accent)}
  .sliders .num{font-family:Consolas,monospace;font-size:12px;text-align:right}
  .result{background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:6px}
  .result .big{font-size:15px;font-weight:700;margin-bottom:4px}
  .result .det{font-size:12px;color:var(--mut)}
  .presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .presets button{background:#0f172a;border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:4px 12px;font-size:12px;cursor:pointer}
  .presets button:hover{border-color:var(--accent);color:var(--accent)}
  .hint{font-size:11px;color:var(--mut);margin-top:10px}
  .legend{position:fixed;bottom:16px;left:16px;background:rgba(30,41,59,.85);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px;z-index:10}
  .title-top{position:fixed;top:16px;left:16px;background:rgba(30,41,59,.85);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;z-index:10}
  .pos{color:var(--green)}.neg{color:var(--red)}.zero{color:var(--amber)}
</style>
</head>
<body>
<div id="canvas3d"></div>
<div class="title-top">🔭 拖动旋转 · 滚轮缩放 | 二次型 xᵀAx = 1 的曲面：椭球（正定）/ 双曲面（不定）/ 柱面（半正定）</div>

<div class="panel">
  <h1>二次型的几何意义</h1>
  <div class="sub">同济第七版 · 第6章 —— 调整对角矩阵 A 的特征值，观察曲面类型随符号变化</div>

  <div class="formula" id="formula">f = λ₁x² + λ₂y² + λ₃z² = 1</div>
  <div class="sliders">
    <div class="row"><label>λ₁</label><input type="range" id="l1" min="-3" max="4" step="0.1" value="2"><span class="num">2.0</span></div>
    <div class="row"><label>λ₂</label><input type="range" id="l2" min="-3" max="4" step="0.1" value="1"><span class="num">1.0</span></div>
    <div class="row"><label>λ₃</label><input type="range" id="l3" min="-3" max="4" step="0.1" value="0.5"><span class="num">0.5</span></div>
  </div>

  <div class="result">
    <div class="big" id="verdict">正定 → 椭球面</div>
    <div class="det" id="detail">特征值全为正 → xᵀAx=1 是椭球面</div>
  </div>

  <div class="presets">
    <button data-p="0">正定（椭球）</button>
    <button data-p="1">负定（虚椭球）</button>
    <button data-p="2">不定（双曲面）</button>
    <button data-p="3">半正定（柱面）</button>
    <button data-p="4">球面（λ全等）</button>
  </div>
  <div class="hint">💡 顺序主子式全正 ⇔ 正定 ⇔ 曲面为椭球；特征值含负 → 双曲面；含零 → 柱面。惯性定理：正/负特征值个数不变</div>
</div>

<div class="legend" style="color:var(--mut)">半透明 = xᵀAx=1 曲面（用 marching 采样点绘制）</div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(6, 4, 7); camera.lookAt(0,0,0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.getElementById('canvas3d').appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.15;
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(5,8,6); scene.add(dl);
scene.add(new THREE.GridHelper(8, 8, 0x334155, 0x1e293b));
const axes = new THREE.Group();
function ax(dir,color){const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),dir.clone().multiplyScalar(4)]);axes.add(new THREE.Line(g,new THREE.LineBasicMaterial({color})));}
ax(new THREE.Vector3(1,0,0),0xf87171);ax(new THREE.Vector3(0,1,0),0x4ade80);ax(new THREE.Vector3(0,0,1),0x60a5fa);
scene.add(axes);

// 曲面点云（采样 f=λ1x²+λ2y²+λ3z²=1）
let pointsMesh = null;
function buildSurface(l1, l2, l3){
  if(pointsMesh){ scene.remove(pointsMesh); pointsMesh.geometry.dispose(); pointsMesh.material.dispose(); }
  const pts = [];
  const N = 40;
  // 参数化：u∈[0,2π], v∈[-π/2,π/2] 椭球；对不定/半正定做裁剪
  const s1 = Math.sign(l1), s2 = Math.sign(l2), s3 = Math.sign(l3);
  const a1 = Math.abs(l1), a2 = Math.abs(l2), a3 = Math.abs(l3);
  if(a1<0.01||a2<0.01||a3<0.01){ // 柱面：用椭圆柱近似（取z自由）
    // 沿 z 轴扫描椭圆环
    for(let iz=-2; iz<=2; iz+=0.1){
      for(let i=0;i<N;i++){
        const t = 2*Math.PI*i/N;
        const x = Math.cos(t)/Math.sqrt(Math.max(a1,0.01));
        const y = Math.sin(t)/Math.sqrt(Math.max(a2,0.01));
        pts.push(new THREE.Vector3(x, y, iz));
      }
    }
  } else if (s1>0 && s2>0 && s3>0){
    // 椭球
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){
      const u = 2*Math.PI*i/N, v = Math.PI*(j/N - 0.5);
      const x = Math.cos(v)*Math.cos(u)/Math.sqrt(a1);
      const y = Math.cos(v)*Math.sin(u)/Math.sqrt(a2);
      const z = Math.sin(v)/Math.sqrt(a3);
      pts.push(new THREE.Vector3(x,y,z));
    }
  } else if (s1>0 && s2>0 && s3<0){
    // 单叶双曲面: x²/a²+y²/b²-z²/c²=1
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){
      const u = 2*Math.PI*i/N; const v = 2.2*(j/N-0.5);
      const ch = Math.cosh(v), sh = Math.sinh(v);
      const x = ch*Math.cos(u)/Math.sqrt(a1);
      const y = ch*Math.sin(u)/Math.sqrt(a2);
      const z = sh/Math.sqrt(a3);
      pts.push(new THREE.Vector3(x,y,z));
    }
  } else if (s1<0 && s2<0 && s3>0){
    // 双叶双曲面: z²/c²-x²/a²-y²/b²=1
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){
      const u = 2*Math.PI*i/N; const v = 1.8*(j/N-0.5);
      const ch = Math.cosh(v), sh = Math.sinh(v);
      const z = ch/Math.sqrt(a3);
      const r = sh;
      const x = r*Math.cos(u)/Math.sqrt(a1);
      const y = r*Math.sin(u)/Math.sqrt(a2);
      pts.push(new THREE.Vector3(x,y,z));
      pts.push(new THREE.Vector3(x,y,-z));
    }
  } else {
    // 其他不定组合：近似双曲抛物面 x²/a1 - y²/a2 = 1 + z项 → 用两族
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){
      const u = 1.8*(i/N-0.5), v = 2*Math.PI*j/N;
      const x = Math.cosh(u)*Math.cos(v)/Math.sqrt(a1);
      const y = Math.cosh(u)*Math.sin(v)/Math.sqrt(a2);
      const z = Math.sinh(u)/Math.sqrt(a3);
      pts.push(new THREE.Vector3(x,y,z));
    }
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  pointsMesh = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0x3b82f6, size: 0.045, transparent: true, opacity: 0.85 }));
  scene.add(pointsMesh);
}

function readLambda(id){ return parseFloat(document.getElementById(id).value)||0; }

function update(){
  const l1=readLambda('l1'), l2=readLambda('l2'), l3=readLambda('l3');
  document.querySelectorAll('#l1,#l2,#l3').forEach((el,idx)=>{
    const v = [l1,l2,l3][idx];
    el.parentElement.querySelector('.num').textContent = v.toFixed(1);
  });
  document.getElementById('formula').textContent = 'f = '+fmt(l1)+'x² '+(l2>=0?'+':'−')+' '+fmt(Math.abs(l2))+'y² '+(l3>=0?'+':'−')+' '+fmt(Math.abs(l3))+'z² = 1';
  const pos = [l1,l2,l3].filter(x=>x>1e-6).length;
  const neg = [l1,l2,l3].filter(x=>x<-1e-6).length;
  const zero = [l1,l2,l3].filter(x=>Math.abs(x)<1e-6).length;
  const vEl = document.getElementById('verdict'), dEl = document.getElementById('detail');
  let cls='';
  if(zero>0){
    vEl.textContent = '半正定/半负定 → 柱面（含零特征值）'; cls='zero';
    dEl.textContent = '有零特征值 → xᵀAx=1 在对应方向无约束 → 柱面；顺序主子式含 0';
  } else if(neg===0){
    vEl.textContent = '正定 → 椭球面'; cls='pos';
    dEl.textContent = '特征值全正 → 所有顺序主子式>0 → 椭球，轴长 = 1/√λᵢ';
  } else if(pos===0){
    vEl.textContent = '负定 → 无实曲面'; cls='neg';
    dEl.textContent = '特征值全负 → xᵀAx=1 无实数解（虚椭球）';
  } else {
    vEl.textContent = '不定 → 双曲面'; cls='';
    dEl.textContent = '正负特征值混合 → 惯性指数 ('+pos+', '+neg+') → 双曲面';
  }
  vEl.className = 'big '+cls;
  buildSurface(l1, l2, l3);
}
function fmt(x){ x=Math.abs(x)<1e-9?0:x; return (Math.round(x*100)/100).toFixed(1); }

document.querySelectorAll('#l1,#l2,#l3').forEach(el=>el.addEventListener('input', update));

const presets = {
  0: [2,1,0.5], 1: [-2,-1,-0.5], 2: [2,-1,0.5], 3: [2,1,0], 4: [1,1,1],
};
document.querySelector('.presets').addEventListener('click', function(e){
  const b = e.target.closest('button'); if(!b) return;
  const v = presets[b.dataset.p];
  document.getElementById('l1').value = v[0];
  document.getElementById('l2').value = v[1];
  document.getElementById('l3').value = v[2];
  update();
});

function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
window.addEventListener('resize', ()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
update(); animate();
</script>
</body>
</html>
