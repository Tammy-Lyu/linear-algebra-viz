<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线性相关性判定定理 · 3D 判定</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--mut:#94a3b8;--accent:#3b82f6;--red:#ef4444;--green:#22c55e;--amber:#f59e0b;--line:#334155}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;overflow:hidden}
  #canvas3d{position:fixed;top:0;left:0;width:100%;height:100%;display:block}
  .panel{position:fixed;top:16px;right:16px;width:300px;background:rgba(30,41,59,.92);border:1px solid var(--line);border-radius:12px;padding:16px;backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:10;max-height:calc(100vh - 32px);overflow-y:auto}
  h1{font-size:17px;margin-bottom:2px}
  .sub{color:var(--mut);font-size:12px;margin-bottom:12px}
  .vec{margin-bottom:6px;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
  .vec-head{display:flex;justify-content:space-between;margin-bottom:2px}
  .vec-name{font-size:13px;font-weight:600}
  .vec .row{display:grid;grid-template-columns:22px 1fr 32px;align-items:center;gap:5px;margin:2px 0}
  .vec .row label{font-size:11px;color:var(--mut);text-align:right}
  .vec input[type=range]{width:100%;accent-color:var(--accent)}
  .vec .num{font-family:Consolas,monospace;font-size:11px;text-align:right}
  .result{background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px}
  .result .big{font-size:15px;font-weight:700;margin-bottom:2px}
  .result .det{font-size:12px;color:var(--mut)}
  .presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .presets button{background:#0f172a;border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:4px 12px;font-size:12px;cursor:pointer}
  .presets button:hover{border-color:var(--amber);color:var(--amber)}
  .hint{font-size:11px;color:var(--mut);margin-top:10px}
  .legend{position:fixed;bottom:16px;left:16px;background:rgba(30,41,59,.85);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px;z-index:10}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .c1{background:#f87171}.c2{background:#4ade80}.c3{background:#60a5fa}
  .title-top{position:fixed;top:16px;left:16px;background:rgba(30,41,59,.85);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;z-index:10}
  .indep{color:var(--green)}.dep{color:var(--red)}
</style>
</head>
<body>
<div id="canvas3d"></div>
<div class="title-top">🔭 拖动旋转 | 线性相关 ⇔ 行列式=0 ⇔ 三向量共面/共线/含零向量</div>

<div class="panel">
  <h1>线性相关性判定定理</h1>
  <div class="sub">同济第七版 · 第4章 —— 3个3维向量：R(A) &lt; 3 ⇔ 线性相关</div>
  <div id="vecs"></div>
  <div class="result">
    <div class="big" id="verdict">线性无关</div>
    <div class="det" id="detail">det ≠ 0 → R(A)=3 → 无关</div>
  </div>
  <div class="presets">
    <button data-p="0">无关</button>
    <button data-p="1">共面（相关）</button>
    <button data-p="2">共线（相关）</button>
    <button data-p="3">含零向量</button>
  </div>
  <div class="hint">💡 判定定理：向量组 α₁,...,αₘ（m&gt;n 时必相关）。3个3维向量：det[α₁α₂α₃]≠0 ⇔ 无关；=0 ⇔ 相关。相关 ⇔ 至少一个向量可由其余线性表示。</div>
</div>

<div class="legend">
  <div><span class="dot c1"></span>α₁</div>
  <div><span class="dot c2"></span>α₂</div>
  <div><span class="dot c3"></span>α₃</div>
  <div style="color:var(--mut)">半透明 = α₁,α₂ 张成平面</div>
</div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(6, 5, 8); camera.lookAt(0,0,0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.getElementById('canvas3d').appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.15;
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
scene.add(new THREE.GridHelper(9, 9, 0x334155, 0x1e293b));
const axes = new THREE.Group();
function ax(dir,color){const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),dir.clone().multiplyScalar(4)]);axes.add(new THREE.Line(g,new THREE.LineBasicMaterial({color})));}
ax(new THREE.Vector3(1,0,0),0xf87171);ax(new THREE.Vector3(0,1,0),0x4ade80);ax(new THREE.Vector3(0,0,1),0x60a5fa);
scene.add(axes);

const cols=[0xf87171,0x4ade80,0x60a5fa], names=['α₁','α₂','α₃'];
const arrows=[], dots=[];
for(let i=0;i<3;i++){
  const a=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(0,0,0),1,cols[i],0.25,0.15);
  scene.add(a);arrows.push(a);
  const d=new THREE.Mesh(new THREE.SphereGeometry(0.07,16,16),new THREE.MeshBasicMaterial({color:cols[i]}));
  scene.add(d);dots.push(d);
}
const plane=new THREE.Mesh(new THREE.PlaneGeometry(8,8),new THREE.MeshBasicMaterial({color:0x3b82f6,transparent:true,opacity:0.15,side:THREE.DoubleSide,depthWrite:false}));
scene.add(plane);

let V=[[2,0,0],[0,3,0],[1,1,1]];
function renderSliders(){
  const vEl=document.getElementById('vecs');vEl.innerHTML='';
  for(let i=0;i<3;i++){
    const box=document.createElement('div');box.className='vec';
    box.innerHTML='<div class="vec-head"><span class="vec-name" style="color:#'+cols[i].toString(16).padStart(6,"0")+'">'+names[i]+'</span></div>';
    ['x','y','z'].forEach((c,ci)=>{
      const row=document.createElement('div');row.className='row';
      row.innerHTML='<label>'+c+'</label><input type="range" min="-4" max="4" step="0.1" value="'+V[i][ci]+'"><span class="num">'+V[i][ci]+'</span>';
      const range=row.querySelector('input');
      range.addEventListener('input',()=>{V[i][ci]=parseFloat(range.value);row.querySelector('.num').textContent=V[i][ci].toFixed(1);update();});
      box.appendChild(row);
    });
    vEl.appendChild(box);
  }
}
function det3(M){return M[0][0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1])-M[0][1]*(M[1][0]*M[2][2]-M[1][2]*M[2][0])+M[0][2]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]);}
function isZero(v){return Math.abs(v[0])<1e-6&&Math.abs(v[1])<1e-6&&Math.abs(v[2])<1e-6;}
function collinear(a,b){const cx=a[1]*b[2]-a[2]*b[1],cy=a[2]*b[0]-a[0]*b[2],cz=a[0]*b[1]-a[1]*b[0];return Math.abs(cx)<1e-6&&Math.abs(cy)<1e-6&&Math.abs(cz)<1e-6;}
function update(){
  const d=det3(V);
  const el=document.getElementById('verdict'),de=document.getElementById('detail');
  const hasZero=V.some(isZero);
  const v12col=collinear(V[0],V[1]);
  let cls,msg;
  if(hasZero){cls='dep';el.textContent='线性相关（含零向量）';msg='存在零向量 → 必相关（0=0·α₂+...，系数不全为零）';}
  else if(Math.abs(d)>1e-6){cls='indep';el.textContent='线性无关';msg='det='+d.toFixed(2)+'≠0 → R(A)=3 → α₁,α₂,α₃ 张成整个空间';}
  else if(v12col){cls='dep';el.textContent='线性相关（共线）';msg='det=0 且 α₁,α₂ 共线 → 秩至多2';}
  else {cls='dep';el.textContent='线性相关（共面）';msg='det=0，α₃ 落在 α₁,α₂ 张成的平面上 → 共面相关';}
  el.className='big '+cls;
  de.textContent=msg+' | det='+d.toFixed(2)+'  R(A)='+(Math.abs(d)>1e-6?3:(v12col||hasZero?1:2));
  // 箭头
  for(let i=0;i<3;i++){
    const v=new THREE.Vector3(V[i][0],V[i][1],V[i][2]),len=v.length();
    if(len<0.02){arrows[i].visible=false;dots[i].visible=false;continue;}
    arrows[i].visible=true;dots[i].visible=true;
    arrows[i].setDirection(v.clone().normalize());
    arrows[i].setLength(len,Math.min(0.3,len*0.18),Math.min(0.18,len*0.1));
    dots[i].position.copy(v);
  }
  // 平面
  if(!isZero(V[0])&&!isZero(V[1])&&!v12col){
    const n=new THREE.Vector3().crossVectors(new THREE.Vector3(...V[0]),new THREE.Vector3(...V[1])).normalize();
    plane.visible=true;plane.lookAt(n);
  }else plane.visible=false;
}
document.querySelector('.presets').addEventListener('click',function(e){
  const b=e.target.closest('button');if(!b)return;
  const presets={
    0:[[2,0,0],[0,3,0],[1,1,1]],
    1:[[2,1,0],[-1,2,0],[1,1,0]],
    2:[[1,0,0],[2,0,0],[0,1,1]],
    3:[[1,0,0],[0,1,0],[0,0,0]]
  };
  V=presets[b.dataset.p].map(r=>r.slice());
  const ranges=document.querySelectorAll('#vecs input[type=range]');let idx=0;
  for(let i=0;i<3;i++)for(let c=0;c<3;c++){ranges[idx].value=V[i][c];ranges[idx].parentElement.querySelector('.num').textContent=V[i][c].toFixed(1);idx++;}
  update();
});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
renderSliders();update();animate();
</script>
</body>
</html>
