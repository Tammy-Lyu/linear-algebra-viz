<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顺序主子式 · 正定判定</title>
<style>
  :root{--bg:#f7f9fc;--card:#fff;--ink:#1f2937;--mut:#6b7280;--accent:#2563eb;--red:#dc2626;--green:#16a34a;--line:#e5e7eb}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);padding:20px;line-height:1.6}
  .wrap{max-width:960px;margin:0 auto}
  h1{font-size:21px;margin-bottom:4px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:700px){.grid2{grid-template-columns:1fr}}
  .matrix-input{display:grid;gap:6px;justify-content:center;margin:8px 0}
  .matrix-input input{width:54px;height:36px;text-align:center;border:1px solid var(--line);border-radius:6px;font-family:Consolas,monospace;font-size:14px;background:#fff}
  .matrix-input input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .result{background:#f0f6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px;margin-top:10px}
  .result .big{font-size:17px;font-weight:700;color:var(--accent);margin-bottom:4px}
  .result .det{font-size:13px;color:#1e40af}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .presets button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer;transition:all .15s}
  .presets button:hover{border-color:var(--accent);color:var(--accent)}
  .steps{font-family:Consolas,monospace;font-size:13px;margin-top:8px;line-height:1.8}
  .steps .s{color:#374151}
  .tip{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 12px;font-size:13px;color:#1e40af;margin-top:12px}
  .sliders{margin:10px 0}
  .sliders .row{display:grid;grid-template-columns:80px 1fr 44px;align-items:center;gap:10px;margin:5px 0}
  .sliders .row label{font-size:13px;color:var(--mut);text-align:right}
  .sliders input[type=range]{width:100%;accent-color:var(--accent)}
  .sliders .num{font-family:Consolas,monospace;font-size:13px;text-align:right}
  .foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
  .ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}

</style>
</head>
<body>
<div class="wrap">
  <h1>顺序主子式 · 正定判定</h1>
  <div class="sub">同济第七版 · 第5/6章 —— 计算 Δ₁,Δ₂,Δ₃，判定正定/半正定/不定</div>

  <div class="card">
    <div style="font-size:14px;font-weight:600;margin-bottom:6px">对称矩阵 A（3×3）</div>
    <div class="matrix-input" id="mA" style="grid-template-columns:repeat(3,54px)">
      <input data-i="0,0" value="2"><input data-i="0,1" value="1"><input data-i="0,2" value="0">
      <input data-i="1,0" value="1"><input data-i="1,1" value="3"><input data-i="1,2" value="1">
      <input data-i="2,0" value="0"><input data-i="2,1" value="1"><input data-i="2,2" value="2">
    </div>
    <div class="result">
      <div class="big" id="verdict">正定（顺序主子式全正）</div>
      <div class="det" id="detail">Δ₁>0, Δ₂>0, Δ₃>0</div>
    </div>
    <div class="presets">
      <button data-p="0">正定</button>
      <button data-p="1">半正定</button>
      <button data-p="2">不定</button>
    </div>
    <div class="tip">💡 顺序主子式：Δₖ = A 的前 k 行前 k 列构成的行列式。正定 ⇔ Δ₁>0,Δ₂>0,...,Δₙ>0；半正定 ⇔ Δₖ≥0。</div>
  </div>
  <div class="card"><div class="steps" id="steps">计算顺序主子式</div></div>
  <div class="foot">线性代数教学智能体 · TF2 可视化 · 顺序主子式</div>
</div>
<script>

let A=[[2,1,0],[1,3,1],[0,1,2]];
function det2(M){return M[0][0]*M[1][1]-M[0][1]*M[1][0];}
function det3(M){return M[0][0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1])-M[0][1]*(M[1][0]*M[2][2]-M[1][2]*M[2][0])+M[0][2]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]);}
function renderInputs(){const mi=document.getElementById('mA');mi.innerHTML='';for(let i=0;i<3;i++)for(let j=0;j<3;j++){const inp=document.createElement('input');inp.dataset.i=i+','+j;inp.value=A[i][j];inp.addEventListener('input',()=>{const[ii,jj]=inp.dataset.i.split(',').map(Number);A[ii][jj]=parseFloat(inp.value)||0;calc();});mi.appendChild(inp);}}
function calc(){
  const d1=A[0][0];
  const d2=det2([[A[0][0],A[0][1]],[A[1][0],A[1][1]]]);
  const d3=det3(A);
  const s1=d1>1e-9, s2=d2>1e-9, s3=d3>1e-9;
  const el=document.getElementById('verdict'), de=document.getElementById('detail'), st=document.getElementById('steps');
  let h='<div class="s">Δ₁ = a₁₁ = '+d1.toFixed(2)+' '+(s1?'> 0 ✓':'≤ 0 ✗')+'</div>';
  h+='<div class="s">Δ₂ = |a₁₁ a₁₂; a₂₁ a₂₂| = '+d2.toFixed(2)+' '+(s2?'> 0 ✓':'≤ 0 ✗')+'</div>';
  h+='<div class="s">Δ₃ = |A| = '+d3.toFixed(2)+' '+(s3?'> 0 ✓':'≤ 0 ✗')+'</div>';
  if(s1&&s2&&s3){el.textContent='正定（顺序主子式全正）';el.className='ok';de.textContent='Δ₁>0, Δ₂>0, Δ₃>0 → A 正定';}
  else if(s1&&s2&&Math.abs(d3)<1e-9){el.textContent='半正定';el.className='';de.textContent='Δ₁>0, Δ₂>0, Δ₃=0 → 半正定（奇异）';}
  else {el.textContent='不定（存在非正顺序主子式）';el.className='bad';de.textContent='至少一个顺序主子式 ≤ 0 → 非正定';}
  st.innerHTML=h;
}
document.querySelectorAll('.presets button').forEach(b=>b.addEventListener('click',()=>{
  const p=b.dataset.p;
  if(p==='0')A=[[2,1,0],[1,3,1],[0,1,2]];
  else if(p==='1')A=[[1,0,0],[0,2,0],[0,0,0]];
  else A=[[1,2,0],[2,1,0],[0,0,3]];
  renderInputs();calc();
}));
renderInputs();calc();
</script>
</body>
</html>
