<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>克拉默法则 · 行列式比值求方程解</title>
<style>
  :root{--bg:#f7f9fc;--card:#fff;--ink:#1f2937;--mut:#6b7280;--accent:#2563eb;--red:#dc2626;--green:#16a34a;--line:#e5e7eb}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);padding:20px;line-height:1.6}
  .wrap{max-width:960px;margin:0 auto}
  h1{font-size:21px;margin-bottom:4px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:700px){.grid2{grid-template-columns:1fr}}
  .matrix-input{display:grid;gap:6px;justify-content:center;margin:8px 0}
  .matrix-input input{width:54px;height:36px;text-align:center;border:1px solid var(--line);border-radius:6px;font-family:Consolas,monospace;font-size:14px;background:#fff}
  .matrix-input input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .result{background:#f0f6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px;margin-top:10px}
  .result .big{font-size:17px;font-weight:700;color:var(--accent);margin-bottom:4px}
  .result .det{font-size:13px;color:#1e40af}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .presets button{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer;transition:all .15s}
  .presets button:hover{border-color:var(--accent);color:var(--accent)}
  .steps{font-family:Consolas,monospace;font-size:13px;margin-top:8px;line-height:1.8}
  .steps .s{color:#374151}
  .tip{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 12px;font-size:13px;color:#1e40af;margin-top:12px}
  .sliders{margin:10px 0}
  .sliders .row{display:grid;grid-template-columns:80px 1fr 44px;align-items:center;gap:10px;margin:5px 0}
  .sliders .row label{font-size:13px;color:var(--mut);text-align:right}
  .sliders input[type=range]{width:100%;accent-color:var(--accent)}
  .sliders .num{font-family:Consolas,monospace;font-size:13px;text-align:right}
  .foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
  .ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}

</style>
</head>
<body>
<div class="wrap">
  <h1>克拉默法则 · 行列式比值求方程解</h1>
  <div class="sub">同济第七版 · 第1章 —— 修改系数，观察 x=Dₓ/D, y=Dᵧ/D 的求解过程</div>

  <div class="card">
    <div style="font-size:14px;font-weight:600;margin-bottom:6px">线性方程组（2 元 2 方程）</div>
    <div class="eqs" id="eqs" style="font-family:Consolas,monospace;font-size:14px;text-align:center;margin:10px 0">
      a₁₁x + a₁₂y = b₁<br>a₂₁x + a₂₂y = b₂
    </div>
    <div class="matrix-input" id="mE" style="grid-template-columns:repeat(6,48px)">
      <input data-e="0,0" value="2"><span style="line-height:36px;text-align:center">x+</span><input data-e="0,1" value="1"><span style="line-height:36px;text-align:center">y=</span><input data-e="0,2" value="5">
      <input data-e="1,0" value="1"><span style="line-height:36px;text-align:center">x+</span><input data-e="1,1" value="3"><span style="line-height:36px;text-align:center">y=</span><input data-e="1,2" value="10">
    </div>
    <div class="result">
      <div class="big" id="sol">x=1, y=3</div>
      <div class="det" id="detail">克拉默法则：x=Dₓ/D, y=Dᵧ/D</div>
    </div>
    <div class="presets">
      <button data-p="0">唯一解</button>
      <button data-p="1">无解/无穷解（D=0）</button>
    </div>
    <div class="tip">💡 克拉默法则：若系数行列式 D≠0，则 xᵢ=Dᵢ/D，其中 Dᵢ 是把第 i 列换成常数项。D=0 时用秩判定解的情况。</div>
  </div>
  <div class="card"><div class="steps" id="steps">计算过程</div></div>
  <div class="foot">线性代数教学智能体 · TF2 可视化 · 克拉默法则</div>
</div>
<script>

let E=[[2,1,5],[1,3,10]];
function det2(M){return M[0][0]*M[1][1]-M[0][1]*M[1][0];}
function renderInputs(){const mi=document.getElementById('mE');mi.innerHTML='';for(let i=0;i<2;i++){for(let j=0;j<2;j++){const inp=document.createElement('input');inp.dataset.e=i+','+j;inp.value=E[i][j];inp.addEventListener('input',()=>{const[ii,jj]=inp.dataset.e.split(',').map(Number);E[ii][jj]=parseFloat(inp.value)||0;calc();});mi.appendChild(inp);}const sp=document.createElement('span');sp.style.cssText='line-height:36px;text-align:center';sp.textContent=j===0?'x+':'y=';mi.appendChild(sp);if(j===1){const inp=document.createElement('input');inp.dataset.e=i+',2';inp.value=E[i][2];inp.addEventListener('input',()=>{E[i][2]=parseFloat(inp.value)||0;calc();});mi.appendChild(inp);}}}
function calc(){
  const A=[[E[0][0],E[0][1]],[E[1][0],E[1][1]]], b=[E[0][2],E[1][2]];
  const D=det2(A);
  const Dx=det2([[b[0],A[0][1]],[b[1],A[1][1]]]);
  const Dy=det2([[A[0][0],b[0]],[A[1][0],b[1]]]);
  const el=document.getElementById('sol'), de=document.getElementById('detail'), st=document.getElementById('steps');
  let h='<div class="s">系数行列式 D = '+D.toFixed(2)+'</div>';
  if(Math.abs(D)<1e-9){
    el.textContent='D=0：不能用克拉默';el.className='bad';
    de.textContent='需用秩判定：R(A) vs R(A|b)';
    st.innerHTML=h+'<div class="s">D=0 → 无唯一解（可能无解或无穷多解）</div>';
    return;
  }
  el.className='';
  const x=Dx/D, y=Dy/D;
  h+='<div class="s">Dₓ = |b₁ a₁₂; b₂ a₂₂| = '+Dx.toFixed(2)+' → x = Dₓ/D = '+x.toFixed(2)+'</div>';
  h+='<div class="s">Dᵧ = |a₁₁ b₁; a₂₁ b₂| = '+Dy.toFixed(2)+' → y = Dᵧ/D = '+y.toFixed(2)+'</div>';
  el.textContent='x='+Math.round(x*100)/100+', y='+Math.round(y*100)/100;
  de.textContent='D='+D.toFixed(2)+'≠0 → 唯一解（克拉默法则适用）';
  st.innerHTML=h;
}
document.querySelectorAll('.presets button').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.p==='0'){E=[[2,1,5],[1,3,10]];}
  else {E=[[1,2,3],[2,4,6]];}
  renderInputs();calc();
}));
renderInputs();calc();
</script>
</body>
</html>
